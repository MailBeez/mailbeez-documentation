name: Deploy MailBeez guide

on:
  push:
    branches: [V5]

permissions: {}

jobs:
  request-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request guide deployment from Forge
        env:
          FORGE_DEPLOY_URL: ${{ secrets.FORGE_GUIDE_DEPLOY_URL }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --proto '=https' --max-time 30 --request POST "${FORGE_DEPLOY_URL:?Missing Forge deployment secret}")
          if [[ "$status" != 2?? ]]; then
            echo "Forge returned HTTP $status" >&2
            exit 1
          fi
          echo "Forge accepted the deployment request for V5 commit $GITHUB_SHA."
